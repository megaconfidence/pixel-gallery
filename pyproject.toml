[project]
name = "pixel-gallery"
version = "0.4.0"
description = "Build a static photo gallery from a folder of images and a shareable theme."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["chonkconf"]

[project.scripts]
pixel-gallery = "pixel_gallery.cli:main"

[tool.uv.sources]
chonkconf = { git = "https://github.com/megaconfidence/chonkconf", tag = "v1.2.0" }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_gallery"]
